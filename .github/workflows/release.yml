name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.0.3)'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  packages: read

jobs:
  release:
    name: Bump, Build, Tag & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x lib/gradlew

      - name: Bump version in build.gradle.kts
        run: |
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' \
            lib/universal-bertlv/build.gradle.kts

      - name: Bump version in pubspec.yaml files
        run: |
          for f in plugin/universal_bertlv/pubspec.yaml \
                   plugin/universal_bertlv_web/pubspec.yaml \
                   plugin/universal_bertlv_mobile/pubspec.yaml; do
            sed -i "s/^version: .*/version: ${{ inputs.version }}/" "$f"
          done

      - name: Run tests
        working-directory: lib
        run: ./gradlew :universal-bertlv:jvmTest :console-emv:jvmTest :universal-bertlv:jsTest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate web JS artifacts (clean build to pick up bumped version)
        working-directory: lib
        run: ./gradlew clean :universal-bertlv:copyJsToWebPlugin --no-build-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/universal-bertlv/build.gradle.kts \
                 plugin/universal_bertlv/pubspec.yaml \
                 plugin/universal_bertlv_web/pubspec.yaml \
                 plugin/universal_bertlv_mobile/pubspec.yaml
          git diff --cached --quiet && echo "Nothing to commit" || \
            (git commit -m "release: v${{ inputs.version }} [skip ci]" && \
             git pull --rebase origin main && git push)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --target main

      - name: Publish Flutter packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Publish Flutter packages to pub.dev" \
            --ref main \
            -f version="${{ inputs.version }}"
