name: Publish Flutter packages to pub.dev

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate web JS payload
        working-directory: lib
        run: |
          chmod +x gradlew
          ./gradlew clean :universal-bertlv:copyJsToWebPlugin --no-build-cache

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Derive release version
        run: echo "VERSION=${{ github.event.release.tag_name }}" | sed 's/^VERSION=v/VERSION=/' >> "$GITHUB_ENV"

      - name: Publish app-facing package
        working-directory: plugin/universal_bertlv
        run: flutter pub publish --force

      - name: Publish web implementation
        run: |
          stage=$(mktemp -d)
          cp -a plugin/universal_bertlv_web/. "$stage"
          perl -0pi -e 's#universal_bertlv:\n    path: \../universal_bertlv#universal_bertlv: ^$ENV{VERSION}#' "$stage/pubspec.yaml"
          cd "$stage"
          flutter pub publish --force

      - name: Publish mobile implementation
        run: |
          stage=$(mktemp -d)
          cp -a plugin/universal_bertlv_mobile/. "$stage"
          perl -0pi -e 's#universal_bertlv:\n    path: \../universal_bertlv#universal_bertlv: ^$ENV{VERSION}#' "$stage/pubspec.yaml"
          cd "$stage"
          flutter pub publish --force
