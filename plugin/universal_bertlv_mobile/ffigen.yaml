# ffigen configuration for universal-bertlv native bindings
# Run: dart run ffigen --config ffigen.yaml
#
# Input: C headers generated by Kotlin/Native when building sharedLib
# Output: Dart FFI bindings

name: BertlvEmvBindings
description: FFI bindings for the universal-bertlv Kotlin/Native shared library
output: lib/src/ffi_bindings.g.dart

# C header generated by Kotlin/Native sharedLib build
# Located at: lib/universal-bertlv/build/bin/<target>/releaseShared/universal_bertlv_api.h
headers:
  entry-points:
    - '../../lib/universal-bertlv/build/bin/androidNativeArm64/releaseShared/libuniversal_bertlv_api.h'

# Only include our exported functions
functions:
  include:
    - 'emv_.*'

# No structs/enums/typedefs needed (pure string-based API)
structs:
  include: []
enums:
  include: []
typedefs:
  include: []
